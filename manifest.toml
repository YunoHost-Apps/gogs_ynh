#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json
packaging_format = 2

id = "gogs"
name = "Gogs"
description.en = "Lightweight self-hosted Git forge"
description.fr = "Forge Git légère auto-hébergé"

version = "0.13.4~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "http://gogs.io"
demo = "https://try.gogs.io/user/login"
admindoc = "https://gogs.io/docs"
code = "https://github.com/gogs/gogs"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = true
sso = true

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/gogs"

    [install.admin]
    type = "user"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

 [resources.sources]
    [resources.sources.main]
    amd64.url = "https://github.com/gogs/gogs/releases/download/v0.13.4/gogs_0.13.4_linux_amd64.tar.gz"
    amd64.sha256 = "2c5bb7261e82b9e2939263225e4bcb36964adae8d6518a9b4c72d15c7a034166"
    arm64.url = "https://github.com/gogs/gogs/releases/download/v0.13.4/gogs_0.13.4_linux_armv8.tar.gz"
    arm64.sha256 = "cbd5b80f9a24bcd84f6a296f218efd0107078fe92ad57b776e715dc84492e7d9"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "gogs_.*_linux_amd64.tar.gz"
    autoupdate.asset.arm64 = "gogs_.*_linux_armv8.tar.gz"

    [resources.ports]

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["data/repositories", "data/avatars", "data/attachments"]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "mariadb-server"

    [resources.database]
    type = "mysql"
