#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json
packaging_format = 2

id = "gogs"
name = "Gogs"
description.en = "Lightweight self-hosted Git forge"
description.fr = "Forge Git légère auto-hébergé"

version = "0.14.3~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "http://gogs.io"
demo = "https://try.gogs.io/user/login"
admindoc = "https://gogs.io/docs"
code = "https://github.com/gogs/gogs"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = true
sso = true

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/gogs"

    [install.admin]
    type = "user"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

 [resources.sources]
    [resources.sources.main]
    amd64.url = "https://github.com/gogs/gogs/releases/download/v0.14.3/gogs_v0.14.3_linux_amd64.tar.gz"
    amd64.sha256 = "c27fbd8337ebd661929389f5237bf601e09958d514835c99fad3b904c63bedb2"
    arm64.url = "https://github.com/gogs/gogs/releases/download/v0.14.3/gogs_v0.14.3_linux_arm64.tar.gz"
    arm64.sha256 = "8cd4659144900235701b96132b9893d5f993a410eeb98d9b904ccb1011451d40"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "gogs_v.*_linux_amd64.tar.gz"
    autoupdate.asset.arm64 = "gogs_v.*_linux_arm64.tar.gz"

    [resources.ports]

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["data/repositories", "data/avatars", "data/attachments"]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "mariadb-server"

    [resources.database]
    type = "mysql"
